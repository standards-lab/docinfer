# CI: the check on every pull request and push to main, and the provider modules' live tiers on a
# push to main and on demand.
# See architecture/standards/go-elemental/principles/release-and-ci.md
# See docs/development.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.4.0
        with:
          install_args: go golangci-lint jq yq github:standards-lab/claude-plugins

      - name: mise run check
        run: mise run check

  integration:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.4.0
        with:
          install_args: go

      - name: mise run integration
        run: mise run integration
