# See architecture/standards/go-elemental/principles/release-and-ci.md
# See architecture/principles/rolling-currency.md
# See docs/development.md
min_version = "2026.10.4"

[settings]
experimental = true
task.run_auto_install = false

[tools]
"aqua:FiloSottile/age" = "1.3.2"
"aqua:google/go-containerregistry" = "0.22.1"
"github:standards-lab/claude-plugins" = { version = "0.24.0", version_prefix = "marathon/v" }
fnox = "1.50.0"
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"
yq = "4.54.3"

[secrets.fnox]

[env]
GO_MODULES = ". postgres cmd/docinfer"
DOCINFER_DSN = "postgres://app:app@127.0.0.1:{{ get_env(name='DOCINFER_POSTGRES_PORT', default='5437') }}/app?sslmode=disable"

[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module, then sqlint the postgres module's SQL, stopping at the first failure, then run lint-context, lint-references, and scripts/lint-secrets.sh, which needs no key; writes nothing"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  go vet -tags integration ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go fix -tags integration -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
  golangci-lint run --build-tags integration ./...
done
echo "check: sqlint"
cd "$MISE_PROJECT_ROOT/postgres"
go tool sqlint .
cd "$MISE_PROJECT_ROOT"
fail=0
for lint in lint-context lint-references; do
  echo "check: $lint"
  if ! command -v "$lint" >/dev/null; then
    echo "FAIL: $lint is not on PATH; run mise install" >&2
    fail=1
  elif ! "$lint"; then
    fail=1
  fi
done
echo "check: lint-secrets"
scripts/lint-secrets.sh || fail=1
exit "$fail"
'''

[tasks."test:integration"]
description = "Run the integration tier against the endpoints the AI_*_BASE_URL variables name, each role whose AI_<ROLE>_TOKEN is unset sending fnox.toml's AI_GATEWAY_TOKEN"
secrets = ["AI_GATEWAY_TOKEN"]
run = '''
set -eu
export GOWORK=off
if [ -n "${AI_GATEWAY_TOKEN:-}" ]; then
  for role in AGENT VISION AUDIO EMBEDDING TRANSCRIPTION; do
    eval "base=\${AI_${role}_BASE_URL:-} token=\${AI_${role}_TOKEN:-}"
    if [ -n "$base" ] && [ -z "$token" ]; then
      export "AI_${role}_TOKEN=$AI_GATEWAY_TOKEN"
    fi
  done
fi
for mod in $GO_MODULES; do
  cd "$MISE_PROJECT_ROOT/$mod"
  [ -d integration ] || continue
  echo "test:integration: $mod"
  go test -race -tags integration -count=1 -v ./integration/...
done
'''

[tasks."integration:postgres"]
description = "Run the postgres module's integration suite against a fresh compose PostgreSQL"
dir = "{{config_root}}"
env = { GOWORK = "off" }
run = '''
set -e
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs postgres; docker compose down postgres; exit $rc' EXIT
docker compose up -d --wait --build postgres
(cd postgres && go test -race -tags integration -count=1 -v ./...)
'''

[tasks.integration]
description = "Run every provider's integration suite (today integration:postgres), continuing past a failure"
run = '''
rc=0
mise -C "$MISE_PROJECT_ROOT" run integration:postgres || rc=1
exit $rc
'''

[tasks.currency]
description = "Report every requirement, Go version, tool, action pin, and compose image pin behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.upgrade]
description = "Upgrade every module's go directive to the current Go minor, with no toolchain line, and its direct requirements and the local mise tools to their latest, rewriting go.mod and mise.toml"
run = '''
set -eu
export GOWORK=off
go_minor=$(mise latest go | cut -d. -f1,2)
for mod in $GO_MODULES; do
  echo "upgrade: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go mod edit -go="$go_minor" -toolchain=none
  direct=$(go mod edit -json | jq -r '.Require[]? | select(.Indirect | not) | .Path')
  [ -z "$direct" ] || go get $(printf '%s@latest ' $direct)
  go mod tidy
done
cd "$MISE_PROJECT_ROOT"
mise upgrade --bump --no-global
'''
