# golangci-lint v2 configuration for the base module, run by `mise run check`: the standard set
# plus depguard, testpackage, and nolintlint.
# See docs/development.md
# See architecture/standards/go-elemental/principles/dependencies.md
# See architecture/standards/go-elemental/principles/tests-and-docs.md
# See architecture/principles/comments.md
version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - depguard
    - nolintlint
    - testpackage
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      skip-regexp: export_test\.go
      allow-packages: [""]
    depguard:
      rules:
        base:
          list-mode: strict
          files:
            - "**/*.go"
          allow:
            - $gostd
            - github.com/standards-lab/docinfer$
            - github.com/standards-lab/docinfer/
            - github.com/standards-lab/docproc$
            - github.com/standards-lab/docproc/
            - github.com/standards-lab/go-ai$
            - github.com/standards-lab/go-ai/
          deny:
            - pkg: github.com/standards-lab/docinfer/postgres
              desc: the base imports no provider; the postgres module depends on the base
